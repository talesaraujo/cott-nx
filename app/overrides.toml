# ----------------------------------------------------------------------------
#  ReXCRT - guest CRT / XAPI functions replaced by the SDK's native versions.
# ----------------------------------------------------------------------------
[rexcrt]

# FIBERS. The game runs cooperative tasks on fibers. A fiber switch swaps the whole CPU state,
# stack pointer included, which recompiled C++ cannot do by itself: each guest fiber also needs
# its own host stack. The SDK runs every guest fiber on a real host fiber (ucontext on Linux,
# hand-written aarch64 switch on Horizon, sdk/src/core/fiber_*.cpp).
# Identified 2026-10-16 from the generated code, by the same signatures as in Mind over Recomp
# (docs/findings/02): thread = *(r13+0x100), thread->fiber = *(thread+0x164).
ConvertThreadToFiber = 0x823E8B50  # SetLastError(0x500 ERROR_ALREADY_FIBER)
ConvertFiberToThread = 0x823E8BE0  # SetLastError(0x501 ERROR_ALREADY_THREAD), clears thread+0x164
CreateFiber          = 0x823E8C30
DeleteFiber          = 0x823E8D10
SwitchToFiber        = 0x823E8D70  # thunk: b XapiSwitchToFiberBody
