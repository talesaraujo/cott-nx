#  COTT - manual declarations for the code generator
#
#  Included from cott_manifest.toml. Included files use the flat schema
#  (sections at the root). Image: base 0x82000000, 6,094,848 bytes,
#  entry point 0x82264F40.
#
#  Every entry says what broke, why, and how it was found.
# ============================================================================

[functions]

# Two functions reached only by tail calls (a plain `b`, no link), so automatic discovery never
# created them. First codegen run:
#   UnresolvedCall: 0x82108F58 from 0x82109E70: b 0x82108F58 - target not in any function
#   UnresolvedCall: 0x823FF1E8 from 0x823FD484: b 0x823FF1E8 - target not in any function
# Sizes from MojoRecomp's function map (config/CrashOfTheTitans.toml), which starts functions at
# both addresses.
"0x82108F58" = { size = 0x10 }
"0x823FF1E8" = { size = 0x8 }

# XAPI fiber internals (statically linked XAPILIB, same layout as in Crash: Mind over Mutant).
# The analyzer does not know that the call at 0x823E9C0C never returns, so it merged the
# fiber-start trampoline with the SwitchToFiber body that follows it (one 0x41C-byte function),
# and the thunk at 0x823E8D70 (`b 0x823E9C10`) then pointed into the middle of a function:
#   Unresolved b target 0x823E9C10 from 0x823E8D70
# 0x823E9C10 reads thread = *(r13+0x100) and fiber = *(thread+0x164), then saves r1, r14-r31,
# CR, LR, FPSCR, f14-f31 and the VMX registers: a full context switch. See [rexcrt] below.
"0x823E9C00" = { name = "XapiFiberStartTrampoline", size = 0x10 }
"0x823E9C10" = { name = "XapiSwitchToFiberBody", size = 0x40C }


# Functions reachable only through pointers (vtables, callbacks): invisible to static analysis,
# so the analyzer glued them onto the function before. At run time they show up one at a time as
#   [FATAL] Call to invalid or unregistered function at guest address 0x823F5880
# (first PC boot, 2026-10-16). MojoRecomp's map has 32 function starts our codegen did not find; 7 are the XAPI fibers handled below
# (tools/mojo_lookup.py --missing app/generated/default); the other 25 are declared here at once.
# Empty {} = "a function starts here": the analyzer finds the extent.
"0x820C2598" = { }   # Mojo size 0x20
"0x820DEAA0" = { }   # Mojo size 0x10
